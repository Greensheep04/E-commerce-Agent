<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>{{ headline }}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f2ed; color: #24342c; font-family: system-ui, sans-serif; }
    main { max-width: 1080px; margin: auto; padding: 48px 24px; }
    .intro { max-width: 760px; margin-bottom: 36px; }
    h1 { font-size: clamp(28px, 5vw, 48px); line-height: 1.2; overflow-wrap: anywhere; }
    p { line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 24px; }
    article { background: white; border: 1px solid #e2e5df; border-radius: 20px; overflow: hidden; }
    img { width: 100%; height: 300px; display: block; object-fit: contain; background: #fafafa; padding: 24px; }
    .copy { padding: 24px; }
    h2 { font-size: 21px; overflow-wrap: anywhere; }
    details { margin-top: 24px; font-size: 12px; color: #657269; overflow-wrap: anywhere; }
    dd { margin: 4px 0 12px; }
    @media (max-width: 600px) { main { padding: 24px 16px; } img { height: 240px; } .copy { padding: 20px; } }
  </style>
</head>
<body>
  <main>
    <header class="intro"><h1>{{ headline }}</h1><p>{{ summary }}</p></header>
    <section class="cards" aria-label="推荐商品">
      {% for item in records %}
      <article>
        <img src="{{ images[item.asset_id] }}" alt="{{ item.title }}">
        <div class="copy">
          <h2>{{ item.title }}</h2><p>{{ item.caption }}</p>
          <details><summary>查看素材来源</summary><dl>
            <dt>来源</dt><dd>{{ item.source_id }}</dd>
            <dt>数据版本</dt><dd>{{ item.source_revision }}</dd>
            <dt>来源记录</dt><dd>{{ item.record_id }}</dd>
            <dt>素材编号</dt><dd>{{ item.asset_id }}</dd>
            <dt>素材版本</dt><dd>{{ item.version_id }}</dd>
            <dt>文件 SHA-256</dt><dd>{{ item.file_sha256 }}</dd>
          </dl></details>
        </div>
      </article>
      {% endfor %}
    </section>
  </main>
</body>
</html>
